# Railway config — `worker` service (Graphile Worker).
# No HTTP server, no public networking, no healthcheck.
# Point this service at this file via Railway dashboard → Config-as-Code path.

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "node dist/server/worker.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
